services:
  codebox:
    image: shroominic/codebox:latest
    container_name: march7-codebox
    restart: unless-stopped
    networks:
      - march7_net
    ports:
      - "127.0.0.1:8069:8069"
    healthcheck:
      test: ["CMD-SHELL", "bash -c '(echo > /dev/tcp/localhost/8069) 2>/dev/null || exit 1'"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
