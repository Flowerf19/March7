services:
  march7:
    image: march7-agent:latest
    build:
      context: ../../
      dockerfile: docker/march7/Dockerfile
      additional_contexts:
        base: service:base
    container_name: march7
    restart: unless-stopped
    networks:
      - march7_net
    ports:
      - "127.0.0.1:8000:8000"
    command: ["python", "-m", "gateway"]
    depends_on:
      redis:
        condition: service_healthy
      codebox:
        condition: service_started
    env_file:
      - ../../.env
    environment:
      # March7-owned runtime
      - AGENT_NAME=march7
      - MARCH7_A2A_PORT=8000
      - MARCH7_REDIS_DB=0
      - MARCH7_PERSONA_PATH=twin/march7/personas

      # Gateway-owned routing
      - GATEWAY_ENABLED_PLATFORMS=discord
      - DISCORD_GATEWAY_ENABLED=true

      # Shared infrastructure
      - REDIS_ENABLED=true
      - REDIS_URL=redis://redis:6379
      - REDIS_DB=0
      - TIMELINE_REDIS_DB=0
      - CODEBOX_API_URL=http://codebox:8069

      # Native System Gateway (runs on the host; HMAC shared secret from .env)
      - SYSTEM_GATEWAY_URL=http://host.docker.internal:8380

      # Peer agent endpoint
      - EVERNIGHT_A2A_URL=http://evernight:8001

      # Peer credential isolation: env_file provides shared config, but the
      # other agent's bot token must never reach this process. Explicit empty
      # overrides win over env_file (compose precedence: environment > env_file).
      - DISCORD_EVERNIGHT_TOKEN=
      # Owner approval key must never reach March7 (Evernight-only mount).
      # Blank both the inline value (unsupported, forbidden) and the file path
      # so a stray .env entry cannot reintroduce them.
      - SYSTEM_GATEWAY_APPROVAL_SECRET=
      - SYSTEM_GATEWAY_APPROVAL_SECRET_FILE=
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ../../twin:/app/twin:ro,z
      - ../../gateway:/app/gateway:ro,z
      # Writable overlay for own persona data only (update_personality writes
      # .md here). Peer persona path stays read-only via the twin mount above.
      - ../../twin/march7/personas:/app/twin/march7/personas:z
      - ../../memories:/app/memories:z
      - ../../data:/app/data:z
      - ../../models:/app/models:ro,z
    healthcheck:
      # /health covers the Discord link, not just the HTTP server: a bot that
      # failed to log in leaves the process reachable but unable to reply.
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
